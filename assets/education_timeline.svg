<svg xmlns="http://www.w3.org/2000/svg" width="920" height="200" viewBox="0 0 920 200">
  <defs>
    <linearGradient id="solidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="904" height="184" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- SOLID axis: starts before B.Eng, goes through B.Eng, through M.S. -->
  <line x1="90" y1="95" x2="560" y2="95"
        stroke="url(#solidGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- DASHED axis: only after M.S. toward Ph.D. -->
  <line x1="560" y1="95" x2="850" y2="95"
        stroke="#8B949E" stroke-width="5" stroke-dasharray="12 9" stroke-linecap="round"/>

  <!-- ===== Node B.Eng (solid filled) ===== -->
  <circle cx="200" cy="95" r="14" fill="#58A6FF" stroke="#E6EDF3" stroke-width="3" filter="url(#soft)"/>
  <circle cx="200" cy="95" r="5" fill="#FFFFFF"/>
  <text x="200" y="40" text-anchor="middle" fill="#E6EDF3"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">2019 – 2023</text>
  <text x="200" y="62" text-anchor="middle" fill="#58A6FF"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">B.Eng.</text>
  <text x="200" y="135" text-anchor="middle" fill="#C9D1D9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Software Engineering</text>
  <text x="200" y="155" text-anchor="middle" fill="#8B949E"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">CQUPT · Chongqing</text>

  <!-- ===== Node M.S. (solid, current) ===== -->
  <circle cx="520" cy="95" r="14" fill="#1F6FEB" stroke="#E6EDF3" stroke-width="3" filter="url(#soft)"/>
  <circle cx="520" cy="95" r="5" fill="#FFFFFF"/>
  <!-- soft ring (static in PNG; animate kept in SVG) -->
  <circle cx="520" cy="95" r="22" fill="none" stroke="#1F6FEB" stroke-width="2" opacity="0.35">
    <animate attributeName="r" values="18;26;18" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="520" y="40" text-anchor="middle" fill="#E6EDF3"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">2025 – Present</text>
  <text x="520" y="62" text-anchor="middle" fill="#79C0FF"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">M.S.</text>
  <text x="520" y="135" text-anchor="middle" fill="#C9D1D9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Software Engineering</text>
  <text x="520" y="155" text-anchor="middle" fill="#8B949E"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">SDJZU · CIC · Prof. Yunan Liu</text>

  <!-- ===== Node Ph.D. (hollow + dashed stroke) ===== -->
  <circle cx="800" cy="95" r="13" fill="#0D1117" stroke="#A371F7" stroke-width="3"
          stroke-dasharray="5 4" filter="url(#soft)"/>
  <text x="800" y="40" text-anchor="middle" fill="#E6EDF3"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Fall 2028</text>
  <text x="800" y="62" text-anchor="middle" fill="#A371F7"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Ph.D.</text>
  <text x="800" y="135" text-anchor="middle" fill="#C9D1D9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Applications</text>
  <text x="800" y="155" text-anchor="middle" fill="#8B949E"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">RL / robotics / embodied AI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220">
  <defs>
    <linearGradient id="solidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#24292F"/>
      <stop offset="45%" style="stop-color:#0E4D92"/>
      <stop offset="100%" style="stop-color:#1F6FEB"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background card -->
  <rect x="8" y="8" width="904" height="204" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- main axis baseline -->
  <!-- solid segment: 2019 -> now (x=80 to x=620) -->
  <line x1="80" y1="100" x2="620" y2="100" stroke="url(#solidGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- dashed segment: now -> 2028 (x=620 to x=840) -->
  <line x1="620" y1="100" x2="840" y2="100" stroke="#6E7681" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>

  <!-- Node 1: B.Eng 2019-2023 -->
  <circle cx="160" cy="100" r="11" fill="#24292F" stroke="#E6EDF3" stroke-width="3" filter="url(#soft)"/>
  <text x="160" y="48" text-anchor="middle" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">2019 – 2023</text>
  <text x="160" y="70" text-anchor="middle" fill="#58A6FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">B.Eng.</text>
  <text x="160" y="140" text-anchor="middle" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Software Engineering</text>
  <text x="160" y="158" text-anchor="middle" fill="#8B949E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">CQUPT · Chongqing</text>
  <text x="160" y="176" text-anchor="middle" fill="#3FB950" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">● completed</text>

  <!-- Node 2: M.S. 2025-Present -->
  <circle cx="480" cy="100" r="11" fill="#1F6FEB" stroke="#E6EDF3" stroke-width="3" filter="url(#soft)"/>
  <!-- pulse ring for "now" -->
  <circle cx="480" cy="100" r="18" fill="none" stroke="#1F6FEB" stroke-width="2" opacity="0.45">
    <animate attributeName="r" values="14;22;14" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="480" y="48" text-anchor="middle" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">2025 – Present</text>
  <text x="480" y="70" text-anchor="middle" fill="#58A6FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">M.S.</text>
  <text x="480" y="140" text-anchor="middle" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Software Engineering</text>
  <text x="480" y="158" text-anchor="middle" fill="#8B949E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">SDJZU · CIC · Prof. Yunan Liu</text>
  <text x="480" y="176" text-anchor="middle" fill="#1F6FEB" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">● current</text>

  <!-- Node 3: PhD 2028 dashed -->
  <circle cx="780" cy="100" r="10" fill="#0D1117" stroke="#A371F7" stroke-width="3" stroke-dasharray="4 3" filter="url(#soft)"/>
  <text x="780" y="48" text-anchor="middle" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Fall 2028</text>
  <text x="780" y="70" text-anchor="middle" fill="#A371F7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Ph.D.</text>
  <text x="780" y="140" text-anchor="middle" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Applications</text>
  <text x="780" y="158" text-anchor="middle" fill="#8B949E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">RL / robotics / embodied AI</text>
  <text x="780" y="176" text-anchor="middle" fill="#A371F7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">○ target (dashed)</text>

  <!-- axis label -->
  <text x="460" y="210" text-anchor="middle" fill="#6E7681" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">solid = completed / ongoing   ·   dashed = future</text>
</svg>
